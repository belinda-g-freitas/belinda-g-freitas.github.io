    <style>
      @import url(styles.css);
      .dropdown-container {
        display: inline-block;
        position: relative;
      }
      .dropdown-trigger {
        display: flex;
        padding: 5px 5px 5px 2px;
        border: none;
        cursor: pointer;
        align-items: center;
        background-color: unset;
      }
      .dropdown-menu {
        position: absolute;
        top: 100%;
        left: 0px;
        z-index: 1000;
        min-width: 150px;
        padding: 4px 0px 4px 0px;
        border: solid var(--text) 1px;
        border-radius: 4px;
        box-shadow: 0px 2px 8px rgba(0, 0, 0, 0.15);
        background-color: var(--bg-color);
      }
      .dropdown-item {
        display: block;
        width: 100%;
        padding: 16px 8px 16px 8px;
        border: none;
        cursor: pointer;
        color: var(--text);
        text-align: left;
        font-size: 14px;
        background-color: unset;
      }
      .dropdown-item:hover {
        color: #ffffff;
        background-color: rgba(245, 245, 245, 0.163);
      }
